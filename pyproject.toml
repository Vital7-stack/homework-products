[build-system]
requires = ["poetry-core>=1.6.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "homework-products"
version = "0.1.0"
description = "Домашнее задание: работа с продуктами и категориями"
authors = [
    {name = "VITAL", email = "zinabir7@gmail.com"}
]
requires-python = "^3.14"
dependencies = []
# packages здесь НЕ нужны, потому что мы в режиме package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^5.0.0"
flake8 = "^7.0.0"
mypy = "^1.10.0"

[tool.flake8]
max-line-length = 109
extend-ignore = ["E203"]

[tool.poetry]
package-mode = false